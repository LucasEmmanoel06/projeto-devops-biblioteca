<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Entrar · Biblioteca</title>
</head>
<body>
  <div class="pagina">
    <aside class="estante">
      <div>
        <h1>Seus livros, no lugar certo.</h1>
        <p>Cadastre, busque e organize o seu acervo em um só lugar.</p>
      </div>
      <div class="lombadas" aria-hidden="true">
        <span class="lombada" style="--h:150px;--cor:#2f5d62"></span>
        <span class="lombada" style="--h:210px;--cor:#7a2e3b"></span>
        <span class="lombada" style="--h:130px;--cor:#d8c9a3"></span>
        <span class="lombada" style="--h:240px;--cor:#4a5a7a"></span>
        <span class="lombada" style="--h:180px;--cor:#b9791a"></span>
        <span class="lombada" style="--h:200px;--cor:#2f5d62"></span>
        <span class="lombada" style="--h:140px;--cor:#7a2e3b"></span>
        <span class="lombada inclinada" style="--h:220px;--cor:#d8c9a3"></span>
      </div>
    </aside>

    <main class="painel">
      <section class="cartao">
        <h2>Entrar</h2>
        <p class="sub">Use o e-mail e a senha da sua conta.</p>

        <div id="aviso" class="aviso" role="alert" hidden></div>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <div class="entrada">
              <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="erro-email">
            </div>
            <p id="erro-email" class="erro-campo"></p>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <div class="entrada com-botao">
              <input id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="erro-senha">
              <button type="button" class="ver-senha" data-alvo="senha" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <p id="erro-senha" class="erro-campo"></p>
          </div>

          <button id="btn-enviar" class="botao" type="submit">Entrar</button>
        </form>

        <p class="troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
